# Builds battery-state for Linux and Windows when a version tag (e.g. v0.1.0) is pushed and
# publishes both as a GitHub release. The binaries are static (CGO_ENABLED=0): the Linux one
# runs on any distro, the Windows one needs no runtime or installer.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # to create the release

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

  release:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        env:
          CGO_ENABLED: "0"
        run: |
          v="${GITHUB_REF_NAME#v}"
          go build -trimpath -ldflags "-s -w -X main.version=$v" -o battery-state ./src
          # -H windowsgui: no console window when the tray starts.
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w -H windowsgui -X main.version=$v" -o battery-state.exe ./src

      - name: Package
        run: |
          linux="battery-state-${GITHUB_REF_NAME}-x86_64-linux"
          mkdir -p "$linux"
          cp battery-state README.md LICENSE "$linux/"
          tar -czf "$linux.tar.gz" "$linux"
          win="battery-state-${GITHUB_REF_NAME}-x86_64-windows"
          mkdir -p "$win"
          cp battery-state.exe README.md LICENSE "$win/"
          zip -r "$win.zip" "$win"
          echo "ARCHIVES=$linux.tar.gz $win.zip" >> "$GITHUB_ENV"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" $ARCHIVES
          --title "battery-state $GITHUB_REF_NAME" --generate-notes
