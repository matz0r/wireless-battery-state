# Vets and tests on Linux and Windows for every push and pull request.
name: Test

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"] # the release workflow tests tags
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - name: Build
        env:
          CGO_ENABLED: "0"
        run: go build ./...
